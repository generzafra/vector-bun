<!doctype html>
<html lang="en" data-brand="vector" data-theme="vector-dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#070A0F" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/brand/vector/favicons/favicon-32x32.png"
		/>
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/brand/vector/favicons/favicon-16x16.png"
		/>
		<link rel="apple-touch-icon" href="/brand/vector/favicons/apple-touch-icon.png" />
		<link rel="manifest" href="/brand/vector/favicons/site.webmanifest" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
