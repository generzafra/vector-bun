name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vector
          POSTGRES_PASSWORD: vector
          POSTGRES_DB: vector
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U vector -d vector"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6382:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://vector:vector@127.0.0.1:5436/vector
      REDIS_URL: redis://127.0.0.1:6382
      SESSION_COOKIE: vector_sid
      CONTROL_ORIGIN: http://localhost:5183
      DELIVERY_ORIGIN: http://localhost:5184
      API_ORIGIN: http://localhost:3011
      SEED_ADMIN_EMAIL: admin@vector.test
      SEED_ADMIN_PASSWORD: ChangeMeNow!vector
      SEED_USER_A_EMAIL: usera@vector.test
      SEED_USER_A_PASSWORD: ChangeMeNow!vector-a
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run db:migrate
      - run: bun run db:seed
      - run: bun test
      - run: bun run typecheck
      - run: bun run build
